[package]
name = "wccloud-web-rust"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = "1.49"
actix-web = { version = "4.12", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "cookies",
    "http2", ] }
actix-cors = "0.7"
actix-multipart = "0.7"
nacos-sdk = "0.5"
tracing = "0.1"
tracing-subscriber = {version =  "0.3",features = ["local-time"] }
lazy_static = "1.5"
#rbs = { version = "4.5" }
#rbatis = '4.5.21'
#rbdc-mysql = { version = "4.5", default-features = false, features = ["tls-native-tls"] }

fastdate = "0.3"
chrono = "0.4"
sea-orm = { version = "1.1.19", features = ["sqlx-mysql", "runtime-tokio-native-tls", "macros", "debug-print"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

redis = { version = "1.0.2", features = ["tokio-comp", "json"] }
redis_pool = "0.10.0"
xor-str = "0.1.4"

minio = "0.3.0"
bytes = "1.11"
futures-util = "0.3"
futures-executor = "0.3"
rs-snowflake = "0.6"
rand = { version = "0.8", features = [] }
http = "0.2"
config = "0.15"
local_ipaddress = "0.1"
time = "0.3"
