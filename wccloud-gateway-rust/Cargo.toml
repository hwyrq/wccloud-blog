[package]
name = "wccloud-gateway-rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.49", features = ["full"] }
actix-web = { version = "4.12", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "cookies",
    "http2",
] }
actix-cors = "0.7"
actix-http = "3.10"
actix-service = "2.0"
futures-util = "0.3"
http = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

nacos-sdk = "0.5"

tracing = "0.1"

tracing-subscriber = { version = "0.3", features = ["local-time"] }

lazy_static = "1.5"
serde_yaml = "0.9"
once_cell = "1.19"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15"
local_ipaddress = "0.1"
time = "0.3"

uuid = { version = "1.0", features = ["v4"] }

url = "2.5"

dashmap = "6.1"

tokio-stream = "0.1"

bytes = "1.11"
regex = "1.0"
